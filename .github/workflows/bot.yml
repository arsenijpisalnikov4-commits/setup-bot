name: setup-bot

# Один запуск работает ~5ч45м и проверяет рынок каждые 5 минут,
# в конце сам перезапускает себя. Расписание - только запасной вариант.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: setup-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Restore state (already sent signals)
        uses: actions/cache/restore@v4
        with:
          path: tg-setup-bot/state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run bot every 5 minutes
        shell: pwsh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $end = (Get-Date).AddMinutes(340)
          while ((Get-Date) -lt $end) {
            pwsh -NoProfile -File ./tg-setup-bot/bot.ps1
            $now = Get-Date
            $wait = 300 - (($now.Minute % 5) * 60 + $now.Second) + 5
            Start-Sleep -Seconds $wait
          }

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tg-setup-bot/state.json
          key: bot-state-${{ github.run_id }}

      - name: Restart loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo ${{ github.repository }} --ref main
